<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Patchwork Pirates</title>
    <style>
      html,
      body,
      #app {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #5ca9c9;
        color: #f8fbff;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      .game-shell,
      .game-canvas {
        width: 100%;
        height: 100%;
        display: block;
      }

      .hud {
        position: fixed;
        left: 16px;
        top: 16px;
        width: min(340px, calc(100vw - 32px));
        padding: 12px;
        box-sizing: border-box;
        background: rgb(18 37 48 / 78%);
        border: 1px solid rgb(255 255 255 / 22%);
        border-radius: 8px;
        box-shadow: 0 8px 22px rgb(0 0 0 / 20%);
        pointer-events: none;
      }

      .hud-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 10px;
        font-weight: 700;
      }

      .status {
        text-transform: uppercase;
        letter-spacing: 0;
        font-size: 12px;
      }

      .wave {
        font-size: 18px;
      }

      .hp-label {
        margin-bottom: 6px;
        font-size: 15px;
        font-weight: 700;
      }

      .hp-track {
        width: 100%;
        height: 16px;
        overflow: hidden;
        background: #301d20;
        border: 1px solid rgb(255 255 255 / 30%);
        border-radius: 5px;
      }

      .hp-fill {
        width: 0%;
        height: 100%;
        background: #2cbe64;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
